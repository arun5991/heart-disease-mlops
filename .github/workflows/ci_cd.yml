name: Heart Disease MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-test-train-build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Lint Code with Flake8
        run: |
          flake8 src/ tests/ notebooks_and_scripts/

      - name: 5. Run Data Acquisition, Cleaning & EDA
        run: |
          python notebooks_and_scripts/01_data_acquisition_and_eda.py

      - name: 6. Train Models & Log to MLflow
        run: |
          python notebooks_and_scripts/02_train_and_track.py

      - name: 7. Run Automated Unit Tests (Pytest)
        run: |
          pytest -v

      - name: 8. Upload Model, Metrics & EDA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlops-run-artifacts
          path: |
            artifacts/models/
            artifacts/plots/
            data/processed/heart_cleaned.csv

      - name: 9. Build & Verify Docker Container
        run: |
          docker build -t heart-disease-api:ci .
          docker run -d --name test_api -p 8000:8000 heart-disease-api:ci
          sleep 5
          python notebooks_and_scripts/03_inference_test.py
          docker stop test_api